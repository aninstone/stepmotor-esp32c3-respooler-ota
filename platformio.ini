; LTS Respooler Control Board - ESP32-C3 (AirM2M core board, same as bajiesp32)
; Official espressif32 platform + Arduino core 2.x  -> NO ESP-IDF download needed.
; NimBLE-Arduino 1.x API (callbacks without NimBLEConnInfo), matching bajiesp32.

; Only ONE active environment on purpose: the main firmware. The OLED test
; build ([env:oled_diag], commented out at the bottom) used to be selectable
; in the status bar and got flashed by mistake -- its screen says "I2C OK!"
; and looks like a broken main firmware. Re-enable it only when testing the
; panel: delete the ';' in front of the [env:oled_diag] block.
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.5.0
board = airm2m_core_esp32c3
; esptool reports 4MB flash on this board but the board JSON leaves flash_size
; empty -> set it explicitly so bootloader/partition table are sized correctly.
board_build.flash_size = 4MB
board_build.flash_mode = dio
; Firmware uses ArduinoOTA + Update.h -> needs app0/app1 OTA pair.
; C3 = 4MB flash, so default.csv (2x 1.25MB app) is the right choice.
board_build.partitions = default.csv
framework = arduino

; Board enumerates as USB-Enhanced-SERIAL CH343. Note: Win32_SerialPort does NOT
; list it (only PnP class Ports does), so auto-detect misses it -> pin it here.
upload_port = COM13
monitor_port = COM13
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    igorantolic/Ai Esp32 Rotary Encoder@^1.7

build_flags =
    -DCORE_DEBUG_LEVEL=0
; main firmware only -- oled_diag.cpp lives in its own env below
build_src_filter = +<main.cpp>

; ---- Standalone OLED diagnostic firmware (DISABLED) ----
; Was selectable in the VSCode status bar and got flashed by accident: it only
; shows a checkerboard then "I2C OK!", which is NOT the control firmware.
; To re-enable: remove the leading ';' from the lines below.
;[env:oled_diag]
;platform = espressif32@6.5.0
;board = airm2m_core_esp32c3
;board_build.flash_size = 4MB
;board_build.flash_mode = dio
;framework = arduino
;upload_port = COM13
;monitor_port = COM13
;monitor_speed = 115200
;lib_deps =
;    adafruit/Adafruit SSD1306@^2.5.9
;    adafruit/Adafruit GFX Library@^1.11.9
;build_flags = -DCORE_DEBUG_LEVEL=0
;build_src_filter = +<oled_diag.cpp>
